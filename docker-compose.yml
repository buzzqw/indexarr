services:
  indexarr:
    build:
      context: .
      args:
        VERSION: ${INDEXARR_VERSION:-dev}
    image: indexarr:${INDEXARR_VERSION:-latest}
    container_name: indexarr
    ports:
      - "8788:8788"
    volumes:
      - indexarr-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  indexarr-data:
