schema: 1
meta:
  id: pagination
  name: Pagination
  type: public
  protocol: torrent
  urls: ["http://REPLACE/"]
capabilities:
  search: [q]
search:
  request:
    get: /page
    params:
      p: "{{ page }}"
  pagination: { type: page, start: 1, step: 1, max_pages: 5, stop_when: empty_rows }
  response:
    type: html
    rows: { selector: "table.results tr.item" }
    fields:
      title: { selector: "a.title" }
      infohash: { selector: "td.hash" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]
