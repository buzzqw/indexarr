schema: 1
meta:
  id: prefix-post
  name: Prefix Post
  type: public
  protocol: torrent
  urls: ["http://REPLACE/base/"]
settings:
  - { name: sort, type: select, default: seeders }
capabilities:
  search: [q]
search:
  request:
    post: /search
    params:
      q: "{{ query.keywords }}"
    form:
      sort: "{{ settings.sort }}"
      page: "{{ page }}"
    headers:
      X-Indexarr-Test: "{{ settings.sort }}"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "table.results tbody tr" }
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]
