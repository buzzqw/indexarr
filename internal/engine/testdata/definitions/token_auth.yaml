schema: 1
meta:
  id: token-auth
  name: Token Auth
  type: private
  protocol: torrent
  urls: ["http://REPLACE/"]
settings:
  - { name: token, type: password, required: true }
capabilities:
  search: [q]
auth: { strategy: token }
search:
  request:
    get: /search
    params: { q: "{{ query.keywords }}" }
  response:
    type: html
    rows: { selector: "table.results tbody tr" }
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]
