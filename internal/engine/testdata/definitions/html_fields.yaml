schema: 1
meta:
  id: html-fields
  name: HTML Fields
  type: public
  protocol: torrent
  urls: ["http://REPLACE/"]
categories:
  - { site: "5", standard: 5040 }
capabilities:
  search: [q]
search:
  request:
    get: /search
    params:
      q: "{{ query.keywords }}"
  response:
    type: html
    rows: { selector: ["table.missing tr", "table.results tr"] }
    fields:
      title: { selector: ["a.missing", "td.name a"], filters: [trim] }
      download: { selector: "a.download", attr: href, type: url }
      category: { selector: "a.cat", attr: href, filters: [{ query_param: cat }], type: category }
      size: { selector: "td.size", type: size }
      seeders: { selector: "td.seeders", type: int }
      date: { selector: "td.date", type: date, layouts: ["02-01-2006 15:04"] }
      infohash: { selector: "td.hash" }
    required: [title, download, size]
