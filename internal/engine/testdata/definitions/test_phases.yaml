schema: 1
meta:
  id: test-phases
  name: Test Phases
  type: public
  protocol: torrent
  urls: ["http://REPLACE/"]
capabilities:
  search: [q]
search:
  request:
    get: /search
    params: { q: "{{ query.keywords }}" }
  response:
    type: html
    rows: { selector: "table.results tbody tr" }
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]
health: { query: probe, min_rows: 1 }
