schema: 1

meta:
  id: auth-basic
  name: Auth Basic
  type: private
  protocol: torrent
  urls: [https://auth-basic.example/]

settings:
  - { name: username, type: text, required: true }
  - { name: password, type: password, required: true }

auth:
  strategy: basic

search:
  request:
    get: /search
    params: { q: "{{ query.keywords }}" }
  response:
    type: xml
    rows: "/rss/channel/item"
    fields:
      title: { selector: title }
      download: { selector: link, type: url }
    required: [title, download]
