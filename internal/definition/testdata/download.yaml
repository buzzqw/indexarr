schema: 1
meta:
  id: download-details
  name: Download Details
  type: public
  protocol: torrent
  urls: [https://download.example/]
capabilities:
  search: [q]
search:
  request:
    get: /browse
    params: { q: "{{ query.keywords }}" }
  response:
    type: html
    rows: { selector: "table.results tbody tr" }
    fields:
      title: { selector: "a.title" }
      details: { selector: "a.title", attr: href, type: url }
    required: [title, details]
download:
  resolve_on: search
  from: details
  max_concurrent: 2
  extract:
    - magnet: { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href$=".torrent"]', attr: href, type: url }
