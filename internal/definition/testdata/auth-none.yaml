schema: 1

meta:
  id: auth-none
  name: Auth None
  type: public
  protocol: torrent
  urls: [https://auth-none.example/]

auth:
  strategy: none

search:
  request:
    get: /search
    params: { q: "{{ query.keywords }}" }
  response:
    type: html
    rows: "table.results tr"
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]

tests:
  - { name: search, fixture: fixtures/auth-none/search.html, expect: { min_rows: 1 } }
