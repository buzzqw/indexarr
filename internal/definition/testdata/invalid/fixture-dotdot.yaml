schema: 1

meta:
  id: fixture-dotdot
  name: Fixture Dotdot
  type: public
  protocol: torrent
  urls: [https://fixture-dotdot.example/]

search:
  request:
    get: /search
  response:
    type: html
    rows: "table.results tr"
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]

tests:
  - name: search
    fixture: ../fixtures/search.html
    expect: { min_rows: 1 }
