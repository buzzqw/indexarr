schema: 1

meta:
  id: unknown-field-type
  name: Unknown Field Type
  type: public
  protocol: torrent
  urls: [https://unknown-field-type.example/]

search:
  request:
    get: /search
  response:
    type: html
    rows: "table.results tr"
    fields:
      title: { selector: "a.title" }
      size: { selector: "td.size", type: boolean }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]

tests:
  - { name: search, fixture: fixtures/unknown-field-type/search.html, expect: { min_rows: 1 } }
