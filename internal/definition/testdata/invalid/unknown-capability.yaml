schema: 1

meta:
  id: unknown-capability
  name: Unknown Capability
  type: public
  protocol: torrent
  urls: [https://unknown-capability.example/]

capabilities:
  search: [q]
  tv-search: [q, season, foo]

search:
  request:
    get: /search
  response:
    type: html
    rows: "table.results tr"
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]

tests:
  - { name: search, fixture: fixtures/unknown-capability/search.html, expect: { min_rows: 1 } }
