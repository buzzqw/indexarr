schema: 1

meta:
  id: required-undefined
  name: Required Undefined
  type: public
  protocol: torrent
  urls: [https://required-undefined.example/]

search:
  request:
    get: /search
  response:
    type: html
    rows: "table.results tr"
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, missing_field]

tests:
  - { name: search, fixture: fixtures/required-undefined/search.html, expect: { min_rows: 1 } }
