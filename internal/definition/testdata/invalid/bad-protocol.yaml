schema: 1

meta:
  id: bad-protocol
  name: Bad Protocol
  type: public
  protocol: ftp
  urls: [https://bad-protocol.example/]

search:
  request:
    get: /search
  response:
    type: html
    rows: "table.results tr"
    fields:
      title: { selector: "a.title" }
      download: { selector: "a.download", attr: href, type: url }
    required: [title, download]

tests:
  - { name: search, fixture: fixtures/bad-protocol/search.html, expect: { min_rows: 1 } }
