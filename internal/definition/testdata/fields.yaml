schema: 1

# fields.yaml exercises every supported field type, selector form, filter form
# and the explicit multi-step form login.
meta:
  id: fields-example
  name: Fields Example
  language: en-US
  type: semi-private
  protocol: torrent
  author: indexarr
  description: Coverage fixture for the native definition format.
  urls:
    - https://fields.example/
    - https://fields-mirror.example/
  updated: "2026-10-23"

settings:
  - { name: username, type: text, label: Username, required: true }
  - { name: password, type: password, label: Password, required: true }
  - name: sort
    type: select
    label: Sort
    default: seeders
    options: [seeders, leechers, date]

categories:
  - { site: "1", standard: 1000, desc: "Console" }
  - { site: "2", standard: 5040, desc: "TV HD" }
  - { site: "3", standard: 8999, desc: "Other" }

capabilities:
  search: [q]
  tv-search: [q, season, ep, imdbid, tvdbid, tvmazeid]
  movie-search: [q, imdbid, tmdbid, year, genre]
  music-search: [q, artist, album, year, genre, rid]
  book-search: [q, author, title, year]

auth:
  strategy: form
  steps:
    - get: /login
      headers: { Accept-Language: en-US }
      extract:
        csrf: { selector: 'input[name="csrf"]', attr: value }
        api: { json: "$.token" }
        nonce: { regex: 'nonce=([a-f0-9]+)' }
    - post: /login
      form:
        username: "{{ settings.username }}"
        password: "{{ settings.password }}"
        csrf: "{{ csrf }}"
      headers: { Referer: /login }
      extract:
        session: { selector: "#session", attr: text }
  success: { selector: "a.logout" }
  failure:
    - { selector: "div.error", message: text }
    - { status: 403, message: forbidden }
  refresh_after: 1h30m

search:
  request:
    post: /search
    params:
      q: "{{ query.keywords }}"
      cat: "{{ categories | join(',') }}"
    form:
      sort: "{{ settings.sort }}"
    headers: { Accept: text/html }
  pagination: { type: cursor, start: 0, step: 50, max_pages: 10, param: cursor, stop_when: empty_rows }
  response:
    type: html
    rows: { selector: "table.results tbody > tr", path: "$.results" }
    fields:
      title:
        selector: ["h2 a", "td.name a"]
        filters: [trim]
        type: text
      size: { selector: "td.size", type: size }
      seeders: { selector: "td.seeders", type: int }
      date: { selector: "td.date", type: date, layouts: ["02-01-2006 15:04", "2006-01-02"] }
      details: { selector: "a.title", attr: href, type: url }
      category:
        selector: "a.cat"
        attr: href
        filters: [{ query_param: cat }]
        type: category
    required: [title, details, size, category]

health:
  query: test
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/fields/search.html
    expect: { min_rows: 1, required: [title, details, size] }
  - name: login-ok
    fixture: fixtures/fields/login-ok.html
    expect: { authenticated: true }
  - name: login-failed
    fixture: fixtures/fields/login-failed.html
    expect: { authenticated: false }
