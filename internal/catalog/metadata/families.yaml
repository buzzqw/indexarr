# Curated tracker-family evidence for manager catalog rows.
#
# A family is recorded only when the site itself shows it or the manager's
# own name says so. It is never inferred from a Cardigann definition: this
# repository does not import Cardigann. "confidence: probable" means the
# software is visible in the API/login shape but the literal product name is
# absent. "evidence" is the public GET that supports the claim.
schema: 1
updated: "2026-10-23"
families:
  # UNIT3D
  hdtorrentsit:
    family: unit3d
    confidence: confirmed
    evidence: "GET https://hdtorrents.eu/login -> 200, page contains unit3d; GET /api/torrents -> 401 JSON"
  shareisland-api:
    family: unit3d
    confidence: confirmed
    evidence: "GET https://shareisland.org/login -> 200, page contains unit3d; GET /api/torrents -> 401 JSON"
  itatorrents:
    family: unit3d
    confidence: probable
    evidence: "GET https://itatorrents.xyz/login -> 200 Laravel login; GET /api/torrents -> 401 JSON, same UNIT3D API shape; literal unit3d marker absent"
  jme-reunit3d-api:
    family: unit3d
    confidence: confirmed
    evidence: "Jackett name JME-REUNIT3D; GET https://jme-reunit3d.de/ -> 503 UNIT3D maintenance page"
  hd-unit3d-api:
    family: unit3d
    confidence: confirmed
    evidence: "Jackett name HD-UNiT3D; GET https://hd-united.vn/ -> 401 JSON, /api/torrents -> 401"

