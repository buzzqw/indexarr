# VERIFICATA (verified). TorrentGalaxy HTML listing.
#
# Written from the public pages captured on 2026-10-24 in
# fixtures/torrentgalaxy/listing-user.html and details-uploader.html. The
# current uploader listing no longer carries a magnet in the row: it has one
# category link, a post-detail link and the size/health cells. The magnet is
# therefore resolved from post-detail while the latest list is read, with the
# existing bounded detail cache. The category comes from the row's
# /get-posts/category:<name>:time:10D link, as in torrentgalaxyclone.
#
# The 13 legacy sources are user pages (/get-posts/user:<name>/), so the
# uploader setting is what turns them into one definition. A request that never
# reads {{ query.* }} is a latest list only: indexarr answers searches from the
# cache and never fans this definition out live.
schema: 1

meta:
  id: torrentgalaxy
  name: TorrentGalaxy
  language: en-US
  type: public
  protocol: torrent
  author: indexarr
  description: Public TorrentGalaxy HTML listing, with magnets in the row.
  urls:
    - https://torrentgalaxy.one/
  updated: "2026-10-24"

settings:
  - name: uploader
    type: text
    label: "Uploader"
    help: "User feed to read, for example anonymous or MIRCrewRS."
    default: "anonymous"
    required: true

categories:
  - { site: "1", standard: 2000, desc: "Movies" }
  - { site: "2", standard: 5000, desc: "TV" }
  - { site: "3", standard: 3000, desc: "Music" }
  - { site: "4", standard: 4000, desc: "Games" }
  - { site: "5", standard: 7000, desc: "Books" }
  - { site: "Anime", standard: 5070, desc: "Anime" }
  - { site: "Documentaries", standard: 5080, desc: "Documentaries" }
  - { site: "XXX", standard: 6000, desc: "Adult" }
  - { site: "Apps", standard: 4000, desc: "Applications" }
  - { site: "Other", standard: 8000, desc: "Other" }

capabilities:
  search: [q]

search:
  request:
    get: "/get-posts/user:{{ settings.uploader }}/"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "div.tgxtablerow" }
    fields:
      title:    { selector: 'a[href*="/post-detail/"]', filters: [trim] }
      details:  { selector: 'a[href*="/post-detail/"]', attr: href, type: url }
      category: { selector: 'a[href*="category:"]', attr: href, filters: [{ regex: "category:([^:]+)" }], type: category }
      size:     { selector: "span.badge.badge-secondary", type: size }
      seeders:  { selector: 'span[title="Seeders/Leechers"] font:first-of-type', type: int }
      leechers: { selector: 'span[title="Seeders/Leechers"] font:last-of-type', type: int }
    required: [title, details, category]

latest:
  request:
    get: "/get-posts/user:{{ settings.uploader }}/"
  pagination: { type: page, start: 1, step: 1, max_pages: 10, param: page, stop_when: empty_rows }

download:
  resolve_on: search
  from: details
  max_concurrent: 4
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href$=".torrent"]', attr: href, type: url }

health:
  query: ""
  min_rows: 1

tests:
  - name: uploader listing
    fixture: fixtures/torrentgalaxy/listing-user.html
    expect: { min_rows: 40, required: [title, details, category] }
  - name: detail
    fixture: fixtures/torrentgalaxy/details-uploader.html
    expect: { min_rows: 0 }
