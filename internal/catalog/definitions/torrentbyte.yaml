# VERIFICATA (verified). TorrentByte public DHT search.
#
# Written from the public search page captured on 2026-10-25 through the local
# FlareSolverr (https://torrentbyte.cc/?q=matrix, HTTP 200 after the Cloudflare
# check) in fixtures/torrentbyte/search.html. Each row carries the title,
# category, size, date, detail link and a direct magnet.
schema: 1

meta:
  id: torrentbyte
  name: TorrentByte
  language: en-US
  type: public
  protocol: torrent
  author: indexarr
  description: Public DHT index protected by Cloudflare, with magnets and size in the result row.
  urls:
    - https://torrentbyte.cc/
  updated: "2026-10-25"
  latest: false

categories:
  - { site: "Movies", standard: 2000, desc: "Movies" }
  - { site: "TV", standard: 5000, desc: "TV" }
  - { site: "Anime", standard: 5070, desc: "Anime" }
  - { site: "Music", standard: 3000, desc: "Audio" }
  - { site: "Games", standard: 4050, desc: "Games" }
  - { site: "Software", standard: 4000, desc: "Applications" }
  - { site: "XXX", standard: 6000, desc: "Adult" }
  - { site: "Other", standard: 8000, desc: "Other" }

capabilities:
  search: [q]

search:
  request:
    get: /
    params:
      q: "{{ query.keywords }}"
  pagination: { type: page, start: 1, step: 1, max_pages: 2, param: page, stop_when: empty_rows }
  response:
    type: html
    rows: { selector: "table tbody tr" }
    fields:
      title:    { selector: "td:nth-of-type(1)", attr: title, filters: [trim] }
      details:  { selector: 'a[href^="?view="]', attr: href, type: url }
      magnet:   { selector: 'a[href^="magnet:"]', attr: href }
      category: { selector: "td:nth-of-type(2) span", filters: [trim], type: category }
      size:     { selector: "td:nth-of-type(3)", type: size }
      date:     { selector: "td:nth-of-type(5)", type: date, layouts: ["2006-01-02 15:04:05"] }
    required: [title, details, magnet, size]

health:
  query: matrix
  min_rows: 4

tests:
  - name: search
    fixture: fixtures/torrentbyte/search.html
    expect: { min_rows: 10, required: [title, details, magnet, size, category] }
