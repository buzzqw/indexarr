capabilities:
  search: [q]
  tv-search: [q]
  movie-search: [q]

search:
  request:
    get: /q.php
    params:
      q: "{{ query.keywords }}"
      cat: "0"
  pagination: { type: none }
  response:
    type: json
    rows: { path: "" }
    fields:
      title:    { path: name, filters: [trim] }
      details:  { path: id, filters: [{ prefix: "https://thepiratebay.org/description.php?id=" }], type: url }
      magnet:   { path: info_hash, filters: [{ prefix: "magnet:?xt=urn:btih:" }] }
      infohash: { path: info_hash }
      size:     { path: size, type: size }
      seeders:  { path: seeders, type: int }
      leechers: { path: leechers, type: int }
      date:     { path: added, type: date }
      category: { path: category, type: category }
    required: [title, magnet, size]

# Real list of new releases: the public precompiled recent index. It is the
# same JSON row shape as the search, so no response override is needed. The
# run filter narrows the rows to the categories the linked apps consume.
latest:
  request:
    get: /precompiled/data_top100_recent.json
  pagination: { type: none }

health:
  query: test
  min_rows: 5

tests:
  - name: search
    fixture: fixtures/thepiratebay/search.json
    expect: { min_rows: 10, required: [title, magnet, size, seeders, category] }
