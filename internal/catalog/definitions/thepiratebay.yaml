  - { site: "499", standard: 4000, desc: "Games other" }
  - { site: "500", standard: 6000, desc: "Adult" }
  - { site: "501", standard: 6000, desc: "Adult movies" }
  - { site: "502", standard: 6000, desc: "Adult DVDR" }
  - { site: "503", standard: 6000, desc: "Pictures" }
  - { site: "504", standard: 6000, desc: "Adult games" }
  - { site: "505", standard: 6000, desc: "Adult HD movies" }
  - { site: "506", standard: 6000, desc: "Adult clips" }
  - { site: "599", standard: 6000, desc: "Adult other" }
  - { site: "600", standard: 8000, desc: "Other" }
