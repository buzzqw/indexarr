# VERIFICATA (verified). 0Magnet public search.
#
# Written from the public search page captured on 2026-10-25 in
# fixtures/0magnet/search.html (https://16mag.net/search?q=matrix) and the
# public detail fixture detail.html (https://16mag.net/!lYWf). The result row
# has title, detail link, size and date; the magnet is an input value on the
# detail page.
schema: 1

meta:
  id: 0magnet
  name: 0Magnet
  language: zh-CN
  type: public
  protocol: torrent
  author: indexarr
  description: Public DHT magnet index with title, size and date in the result row.
  urls:
    - https://16mag.net/
  updated: "2026-10-25"
  latest: false

capabilities:
  search: [q]

categories:
  - { site: "Other", standard: 8000, desc: "Other" }

search:
  request:
    get: /search
    params:
      q: "{{ query.keywords }}"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "tr" }
    fields:
      title:   { selector: "td.result-title a", filters: [trim] }
      details: { selector: "td.result-title a", attr: href, type: url }
      size:    { selector: "td.result-meta div:first-child", type: size }
      date:    { selector: "td.result-meta div.result-date", type: date, layouts: ["2006-01-02"] }
    required: [title, details, size]

download:
  resolve_on: search
  from: details
  max_concurrent: 4
  extract:
    - magnet: { selector: "input#input-magnet", attr: value }

health:
  query: matrix
  min_rows: 3

tests:
  - name: search
    fixture: fixtures/0magnet/search.html
    expect: { min_rows: 4, required: [title, details, size] }
  - name: detail
    fixture: fixtures/0magnet/detail.html
    expect: { min_rows: 0 }
