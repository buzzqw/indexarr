# IN PROVA (trial). Corsaro account variant with a pasted session cookie.
#
# The guest definition corsaro.yaml stays unchanged: this file is the account
# variant and shares the same public listing layout. The public login page was
# captured on 2026-10-23 in fixtures/corsaro-account/login.html; it shows a
# reCAPTCHA marker (input[name="trp_recaptcha_required"]), so a fully automatic
# login is not possible. The supported path is auth.strategy cookie: the user
# logs in with a browser and pastes the Cookie request header into the form.
# The search request is the one the site documents in its own search form
# (index.php page=torrents&search=...); guests get "Non sei autorizzato a usare
# il sistema di ricerca interno", account holders do not. Search pages are
# synthetic fixtures that keep the observed markup; see
# fixtures/corsaro-account/README.md.
schema: 1

# The public origin answers a plain client with 429/503 (Cloudflare in front of
# nginx); the page opens in a browser. The pasted account cookie must travel
# through the same FlareSolverr session as the request.
session:
  mode: flaresolverr
  name_prefix: corsaro-account-idx

meta:
  id: corsaro-account
  name: Corsaro (account)
  language: it-IT
  type: semi-private
  protocol: torrent
  author: indexarr
  description: ilCorSaRoBlu with login and keyword search (account required).
  urls:
    - https://ilcorsaroblu.org/
  updated: "2026-10-29"

settings:
  - name: cookie
    type: password
    label: "Session cookie"
    help: "Log in with a browser, open DevTools → Network, reload a page, select a request to ilcorsaroblu.org and copy its Cookie request header. The site uses reCAPTCHA, so this is the supported login path."
    required: true
  - name: category
    type: text
    label: "Category id"
    help: "Site category id; 0 means all categories."
    default: "0"

categories:
  - { site: "2", standard: 3000, desc: "Audio / Music" }
  - { site: "13", standard: 2040, desc: "Movies 1080p" }
  - { site: "14", standard: 2040, desc: "Movies 720p" }
  - { site: "0", standard: 8000, desc: "Other" }

capabilities:
  search: [q]

auth:
  # The site's login has a reCAPTCHA: there is no form step to automate. The
  # engine sends the pasted Cookie header on every request.
  strategy: cookie

search:
  request:
    get: /index.php
    params:
      page: torrents
      search: "{{ query.keywords }}"
      category: "{{ settings.category }}"
      active: "0"
      options: "0"
  pagination: { type: page, start: 1, max_pages: 3, param: pages, stop_when: empty_rows }
  response:
    type: html
    rows: { selector: "table.lista tr" }
    fields:
      title:    { selector: 'td[style*="padding-left:10px"] a', filters: [trim] }
      details:  { selector: 'td[style*="padding-left:10px"] a', attr: href, type: url }
      magnet:   { selector: 'a[href^="magnet:"]', attr: href }
      category: { selector: 'a[href*="category="]', attr: href, filters: [{ query_param: category }], type: category }
      size:     { selector: "td.lista:nth-last-of-type(2)", type: size }
      seeders:  { selector: "td.lista:nth-of-type(6)", type: int }
      leechers: { selector: "td.lista:nth-of-type(7)", type: int }
      date:     { selector: "td.lista:nth-of-type(5)", type: date, layouts: ["02/01/2006"] }
    required: [title, magnet]

download:
  resolve_on: grab
  from: details
  max_concurrent: 2
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href*="download.php"]', attr: href, type: url }

health:
  query: ""
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/corsaro-account/search.html
    expect: { min_rows: 3, required: [title, magnet] }
