# IN PROVA (trial). ilDraGoNeRo private tracker (phpBB based).
#
# Written from the public login page captured on 2026-10-23 in
# fixtures/ildragonegro/login.html (https://ildragonero2.info/forum/ucp.php?mode=login).
# The forum refuses guest search ("Non ti è permesso di utilizzare il sistema
# di ricerca"), so the search fixture is synthetic and keeps the standard phpBB
# search-result markup; the topic fixture keeps a magnet in the post body. The
# supported login path is a pasted session cookie (auth.strategy cookie): the
# phpBB form_token/sid flow is fragile and cannot be verified without an
# account. A desktop browser User-Agent is sent explicitly: the site redirects
# the default client to the index page. State stays "bozza" until the
# coordinator verifies it with an account.
schema: 1

meta:
  id: ildragonegro
  name: ilDraGoNeRo
  language: it-IT
  type: private
  protocol: torrent
  author: indexarr
  description: ilDraGoNeRo Italian tracker (phpBB login and forum search).
  urls:
    - https://www.ildragonero2.info/
    - http://www.ildragonero2.info/
  updated: "2026-10-23"
  latest: false

settings:
  - name: cookie
    type: password
    label: "Session cookie"
    help: "Paste the Cookie request header copied from the browser after logging in to the forum."
    required: true

categories:
  - { site: "0", standard: 8000, desc: "Other" }

capabilities:
  search: [q]

auth:
  # The phpBB login needs a form_token and a session id; a cookie copied from
  # a logged-in browser is the stable path and the engine sends it as-is.
  strategy: cookie

search:
  request:
    get: /forum/search.php
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
    params:
      keywords: "{{ query.keywords }}"
      terms: all
      sf: all
      sr: topics
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "div.search" }
    fields:
      title:    { selector: "h3 a", filters: [trim] }
      details:  { selector: "h3 a", attr: href, type: url }
      magnet:   { selector: 'a[href^="magnet:"]', attr: href }
      date:     { selector: "time", attr: datetime, type: date }
    required: [title, details]

download:
  resolve_on: grab
  from: details
  max_concurrent: 2
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href*="download/file.php"]', attr: href, type: url }

health:
  query: test
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/ildragonegro/search.html
    expect: { min_rows: 3, required: [title, details] }
  - name: detail
    fixture: fixtures/ildragonegro/detail.html
    expect: { min_rows: 0 }
