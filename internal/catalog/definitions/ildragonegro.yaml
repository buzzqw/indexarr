# IN PROVA (trial). ilDraGoNeRo private tracker (phpBB based).
#
# Written from the public login page captured on 2026-10-23 in
# fixtures/ildragonegro/login.html (https://ildragonero2.info/forum/ucp.php?mode=login).
# The forum refuses guest search ("Non ti è permesso di utilizzare il sistema
# di ricerca"), so the search fixture is synthetic and keeps the standard phpBB
# search-result markup; the topic fixture keeps a magnet in the post body. The
# login form needs the phpBB form_token, creation_time and session id, which
# are extracted from the login page. A desktop browser User-Agent is sent
# explicitly: the site redirects the default client to the index page. State
# stays "bozza" until the coordinator verifies it with an account.
schema: 1

meta:
  id: ildragonegro
  name: ilDraGoNeRo
  language: it-IT
  type: private
  protocol: torrent
  author: indexarr
  description: ilDraGoNeRo Italian tracker (phpBB login and forum search).
  urls:
    - https://www.ildragonero2.info/
    - http://www.ildragonero2.info/
  updated: "2026-10-23"

settings:
  - { name: username, type: text, label: "Username", required: true }
  - { name: password, type: password, label: "Password", required: true }

categories:
  - { site: "0", standard: 8000, desc: "Other" }

capabilities:
  search: [q]

auth:
  strategy: form
  steps:
    - get: /forum/ucp.php?mode=login
      headers:
        User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
      extract:
        form_token: { selector: 'input[name="form_token"]', attr: value }
        creation_time: { selector: 'input[name="creation_time"]', attr: value }
        sid: { selector: 'input[name="sid"]', attr: value }
    - post: /forum/ucp.php?mode=login
      headers:
        User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
      form:
        username: "{{ settings.username }}"
        password: "{{ settings.password }}"
        form_token: "{{ form_token }}"
        creation_time: "{{ creation_time }}"
        sid: "{{ sid }}"
        login: "Login"
  success: { selector: 'a[href*="mode=logout"]' }
  failure:
    - { selector: "div.error", message: text }
  refresh_after: 6h

search:
  request:
    get: /forum/search.php
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
    params:
      keywords: "{{ query.keywords }}"
      terms: all
      sf: all
      sr: topics
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "div.search" }
    fields:
      title:    { selector: "h3 a", filters: [trim] }
      details:  { selector: "h3 a", attr: href, type: url }
      magnet:   { selector: 'a[href^="magnet:"]', attr: href }
      date:     { selector: "time", attr: datetime, type: date }
    required: [title, details]

download:
  resolve_on: grab
  from: details
  max_concurrent: 2
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href*="download/file.php"]', attr: href, type: url }

health:
  query: test
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/ildragonegro/search.html
    expect: { min_rows: 3, required: [title, details] }
  - name: detail
    fixture: fixtures/ildragonegro/detail.html
    expect: { min_rows: 0 }
  - name: login-ok
    fixture: fixtures/ildragonegro/login-ok.html
    expect: { authenticated: true }
  - name: login-failed
    fixture: fixtures/ildragonegro/login-failed.html
    expect: { authenticated: false }
