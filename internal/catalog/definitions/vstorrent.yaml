# BOZZA (draft). Public RSS feed preset.
#
# The feed was probed on 2026-10-25 and contains torrent links (magnet or
# .torrent). No offline fixture yet: the state stays "bozza" until the feed is
# captured and tested. The generic RSS connector handles the parsing.
schema: 1
connector: rss

meta:
  id: vstorrent
  name: VSTorrent
  language: en-US
  type: public
  protocol: torrent
  author: indexarr
  description: Public audio software RSS feed with magnet links.
  urls:
    - https://vstorrent.org/feed/
  updated: "2026-10-25"

settings:
  - { name: url, type: text, label: Feed URL, help: "RSS or Atom feed URL", required: true, default: "https://vstorrent.org/feed/" }

categories:
  - { site: "4000", standard: 4000, desc: "Software" }

capabilities:
  search: [q]

health:
  query: test
  min_rows: 0
