# IN PROVA (trial). IPTorrents with a pasted browser session cookie.
#
# The form login cannot be automated: the site protects it with Cloudflare
# Turnstile. A POST to /do-login.php with username and password answers
# 302 /login.php?error=captcha (measured 2026-10-29) and leaves no cookie.
# The supported path is the one Jackett uses too: paste the Cookie header of a
# logged-in browser and keep the same User-Agent, because the site ties the
# session to it.
#
# The search page is the one Jackett's IPTorrents indexer reads: /t with the
# query in q, the sort in o, the freeleech flag in free=on and the site
# categories as query keys. Categories are declared for the Torznab capability
# and to map every row, but are not sent: the definition format has no dynamic
# query keys and the title query is already selective. Rows are
# table#torrents > tbody > tr, the title is a.hv, the .torrent link is
# /download.php/..., the category is the ?<id> icon and span.free marks a
# freeleech release.
#
# Site settings recommended by Jackett, otherwise the columns move:
# - Torrents per page: 100
# - Torrents - Show files count: on
# - Torrents category column: Icons
#
# State is "bozza" until search, detail and grab are verified with a real
# account; the fixture is synthetic and keeps the observed shape.
schema: 1

meta:
  id: iptorrents
  name: IPTorrents
  language: en-US
  type: private
  protocol: torrent
  author: indexarr
  description: Private IPTorrents with a pasted session cookie, keyword search and a freeleech filter.
  urls:
    - https://iptorrents.com/
    - https://www.iptorrents.com/
  updated: "2026-10-29"
  latest: false

settings:
  - name: cookie
    type: password
    label: "Session cookie"
    help: "Log in with a browser, open DevTools > Network, reload a page, select a request to iptorrents.com and copy its Cookie request header. Or leave it empty and use Import cookie. The login form is protected by Cloudflare Turnstile."
    required: false
  - name: freeleech
    type: checkbox
    label: "Freeleech only"
    help: "Ask the site for freeleech releases only (free=on)."
    default: false

