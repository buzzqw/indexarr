capabilities:
  search: [q]
  tv-search: [q, season, ep]
  movie-search: [q]
  music-search: [q]
  book-search: [q]

auth:
  # The form login needs a Cloudflare Turnstile token: a cookie copied from a
  # logged-in browser is the stable path and the engine sends it as-is.
  strategy: cookie

search:
  request:
    get: /t
    params:
      q: "{{ query.keywords }}"
    params_multi:
      free: ['{{ settings.freeleech | ifset("on") }}']
  pagination: { type: page, start: 1, max_pages: 3, param: p, stop_when: empty_rows }
  # An expired cookie is answered with the login page, not with an empty
  # result set: fail loudly instead of showing zero releases.
  blocked: { selector: 'form[action="do-login.php"]', message: "the IPTorrents session cookie has expired: paste a new one from the browser" }
  response:
    type: html
    rows: { selector: 'table[id="torrents"] > tbody > tr' }
    fields:
      title:    { selector: 'td.al a[href^="/t/"]', filters: [trim] }
      details:  { selector: 'td.al a[href^="/t/"]', attr: href, type: url }
      download: { selector: 'a[href^="/download.php/"]', attr: href, type: url }
      category: { selector: 'td:nth-of-type(1) a[href^="?"]', attr: href, filters: [{ regex: '\?(\d+)' }], type: category }
      freeleech: { selector: "span.free" }
      size:     { selector: "td:nth-of-type(6)", type: size }
      seeders:  { selector: "td:nth-of-type(8)", type: int }
      leechers: { selector: "td:nth-of-type(9)", type: int }
    required: [title, details, download, size, seeders]

health:
  query: "1080p"
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/iptorrents/search.html
    expect: { min_rows: 3, required: [title, details, download, size, seeders, category] }
