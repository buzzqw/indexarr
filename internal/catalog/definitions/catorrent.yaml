# VERIFICATA (verified). Catorrent public game search (DataLife Engine).
#
# Written from the public search page captured on 2026-10-27 in
# fixtures/catorrent/search.html
# (https://catorrent.net/index.php?do=search&subaction=search&story=fallout)
# and from one game page in fixtures/catorrent/detail.html. The search card
# has the title, platform and game page; the game page has the .torrent link
# ("Скачать: 38.36 GB") with the size. The site answers that link with an HTML
# page unless the request carries the game page as Referer, which the engine
# sends for every .torrent found on a details page.
schema: 1

meta:
  id: catorrent
  name: Catorrent
  language: ru-RU
  type: public
  protocol: torrent
  author: indexarr
  description: Public Russian PC game catalogue; the .torrent and size are on the game page.
  urls:
    - https://catorrent.net/
  updated: "2026-10-27"
  latest: false

categories:
  - { site: "PC", standard: 4050, desc: "PC games" }

capabilities:
  search: [q]

search:
  request:
    get: /index.php
    params:
      do: search
      subaction: search
      story: "{{ query.keywords }}"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "div.short_game_search" }
    fields:
      title:    { selector: "div.short_game_h1", filters: [trim] }
      details:  { selector: "a", attr: href, type: url }
      category: { selector: "div.short_game_platform", filters: [trim], type: category }
    required: [title, details]

download:
  resolve_on: grab
  from: details
  size: { selector: "div.izdan_down a span", filters: [{ regex: '([0-9.,]+\s*[KMGT]B)' }] }
  extract:
    - torrent: { selector: "div.izdan_down a", attr: href, type: url }

health:
  query: fallout
  min_rows: 3

tests:
  - name: search
    fixture: fixtures/catorrent/search.html
    expect: { min_rows: 10, required: [title, details, category] }
  - name: detail
    fixture: fixtures/catorrent/detail.html
    expect: { min_rows: 0 }
