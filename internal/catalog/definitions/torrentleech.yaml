# IN PROVA (trial). TorrentLeech with login and JSON search.
#
# Captured on 2026-10-26 with a working account:
# - the login page (https://www.torrentleech.org/) posts username/password to
#   /user/account/login/, no CSRF field (fixtures/torrentleech/login.html);
# - the browse endpoint answers JSON, not HTML:
#   /torrents/browse/list/query/<q> -> {numFound, torrentList:[...]}. Each row
#   carries fid, name, filename, categoryID, addedTimestamp, size (a float in
#   scientific notation), seeders, leechers, completed;
# - the details page /torrent/<fid> exposes the release button
#   href="/download/<fid>/<filename>.torrent".
# Search results and the release page fixtures are synthetic and keep the
# observed shape; see fixtures/torrentleech/README.md. State is "bozza" until
# login, search and a grab are verified with an account.
schema: 1

meta:
  id: torrentleech
  name: TorrentLeech
  language: en-US
  type: private
  protocol: torrent
  author: indexarr
  description: Private TorrentLeech with login, keyword search and a JSON listing.
  urls:
    - https://www.torrentleech.org/
  updated: "2026-10-26"
  latest: false

settings:
  - { name: username, type: text, label: "Username", required: true }
  - { name: password, type: password, label: "Password", required: true }

categories:
  - { site: "8",  standard: 2030, desc: "Movies Cam" }
  - { site: "9",  standard: 2030, desc: "Movies TS/TC" }
  - { site: "11", standard: 2030, desc: "Movies DVDRip/DVDScreener" }
  - { site: "37", standard: 2080, desc: "Movies WEBRip" }
  - { site: "43", standard: 2040, desc: "Movies HDRip" }
  - { site: "14", standard: 2040, desc: "Movies BlurayRip" }
  - { site: "12", standard: 2070, desc: "Movies DVD-R" }
  - { site: "13", standard: 2050, desc: "Movies Bluray" }
  - { site: "47", standard: 2045, desc: "Movies 4K" }
  - { site: "15", standard: 2000, desc: "Movies Boxsets" }
  - { site: "29", standard: 2020, desc: "Documentaries" }
  - { site: "36", standard: 2010, desc: "Movies Foreign" }
  - { site: "26", standard: 5030, desc: "TV Episodes" }
  - { site: "32", standard: 5040, desc: "TV Episodes HD" }
  - { site: "27", standard: 5000, desc: "TV Boxsets" }
  - { site: "34", standard: 5070, desc: "TV Anime" }
  - { site: "35", standard: 5000, desc: "TV Cartoons" }
  - { site: "44", standard: 5020, desc: "TV Foreign" }
  - { site: "17", standard: 4050, desc: "Games PC" }
  - { site: "42", standard: 4030, desc: "Games Mac" }
  - { site: "18", standard: 1040, desc: "Games XBOX" }
  - { site: "19", standard: 1050, desc: "Games XBOX360" }
  - { site: "40", standard: 1140, desc: "Games XBOXONE" }
  - { site: "20", standard: 1080, desc: "Games PS2" }
  - { site: "21", standard: 1080, desc: "Games PS3" }
  - { site: "39", standard: 1180, desc: "Games PS4" }
  - { site: "49", standard: 1180, desc: "Games PS5" }
  - { site: "22", standard: 1020, desc: "Games PSP" }
  - { site: "28", standard: 1030, desc: "Games Wii" }
  - { site: "30", standard: 1010, desc: "Games Nintendo DS" }
  - { site: "48", standard: 1000, desc: "Games Nintendo Switch" }
  - { site: "23", standard: 4020, desc: "PC ISO" }
  - { site: "24", standard: 4030, desc: "PC Mac" }
  - { site: "25", standard: 4040, desc: "PC Mobile" }
  - { site: "33", standard: 4010, desc: "PC 0-day" }
  - { site: "38", standard: 7000, desc: "Education" }
  - { site: "45", standard: 7020, desc: "Books EBooks" }
  - { site: "46", standard: 7030, desc: "Books Comics" }
  - { site: "31", standard: 3000, desc: "Audio" }
  - { site: "16", standard: 3020, desc: "Music videos" }

capabilities:
  search: [q]
  tv-search: [q, season, ep]
  movie-search: [q]

auth:
  strategy: form
  steps:
    - get: /
    - post: /user/account/login/
      form:
        username: "{{ settings.username }}"
        password: "{{ settings.password }}"
  success: { selector: 'a[href*="/user/account/logout"]' }
  failure:
    - { selector: "div.alert-danger", message: text }
  refresh_after: 6h

search:
  request:
    get: "/torrents/browse/list/query/{{ query.keywords }}"
  pagination: { type: none }
  response:
    type: json
    rows: { path: "torrentList" }
    fields:
      title:    { path: "name", filters: [trim] }
      details:  { path: "fid", filters: [{ prefix: "/torrent/" }], type: url }
      category: { path: "categoryID", type: category }
      date:     { path: "addedTimestamp", type: date, layouts: ["2006-01-02 15:04:05"] }
      size:     { path: "size", type: size }
      seeders:  { path: "seeders", type: int }
      leechers: { path: "leechers", type: int }
    required: [title, details]

download:
  resolve_on: grab
  from: details
  max_concurrent: 2
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href$=".torrent"]', attr: href, type: url }

health:
  query: test
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/torrentleech/search.json
    expect: { min_rows: 3, required: [title, details, size, seeders, category, date] }
  - name: detail
    fixture: fixtures/torrentleech/detail.html
    expect: { min_rows: 0 }
  - name: login-ok
    fixture: fixtures/torrentleech/login-ok.html
    expect: { authenticated: true }
  - name: login-failed
    fixture: fixtures/torrentleech/login-failed.html
    expect: { authenticated: false }
