# IN PROVA (trial). TorrentLeech with login and keyword search.
#
# The public login page was captured on 2026-10-23 in
# fixtures/torrentleech/login.html (https://www.torrentleech.org/): a plain
# form posting username/password to /user/account/login/, no CSRF field. The
# browse path /torrents/browse/list/query/<q> redirects guests to the login
# page, which is how it was confirmed. Search results and the release page are
# synthetic fixtures that keep the table and action markup; see
# fixtures/torrentleech/README.md. The previous RSS-only definition stays
# available as torrentleech-rss.yaml. State is "bozza" until the coordinator
# verifies both login and search with an account.
schema: 1

meta:
  id: torrentleech
  name: TorrentLeech
  language: en-US
  type: private
  protocol: torrent
  author: indexarr
  description: Private TorrentLeech with login and keyword search.
  urls:
    - https://www.torrentleech.org/
  updated: "2026-10-23"

settings:
  - { name: username, type: text, label: "Username", required: true }
  - { name: password, type: password, label: "Password", required: true }

categories:
  - { site: "1", standard: 2000, desc: "Movies" }
  - { site: "2", standard: 5000, desc: "TV" }
  - { site: "3", standard: 3000, desc: "Music" }
  - { site: "4", standard: 4000, desc: "Games" }
  - { site: "5", standard: 7000, desc: "Books" }
  - { site: "0", standard: 8000, desc: "Other" }

capabilities:
  search: [q]
  tv-search: [q, season, ep]
  movie-search: [q]

auth:
  strategy: form
  steps:
    - get: /
    - post: /user/account/login/
      form:
        username: "{{ settings.username }}"
        password: "{{ settings.password }}"
  success: { selector: 'a[href*="/user/account/logout"]' }
  failure:
    - { selector: "div.alert-danger", message: text }
  refresh_after: 6h

search:
  request:
    get: "/torrents/browse/list/query/{{ query.keywords }}"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "table#torrenttable tbody tr" }
    fields:
      title:    { selector: "td.name a", filters: [trim] }
      details:  { selector: "td.name a", attr: href, type: url }
      category: { selector: "td.category a", attr: href, filters: [{ regex: "category/([0-9]+)" }], type: category }
      date:     { selector: "td.added", type: date, layouts: ["2006-01-02 15:04:05"] }
      size:     { selector: "td.size", type: size }
      seeders:  { selector: "td.seeders", type: int }
      leechers: { selector: "td.leechers", type: int }
    required: [title, details]

download:
  resolve_on: grab
  from: details
  max_concurrent: 2
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href$=".torrent"]', attr: href, type: url }

health:
  query: test
  min_rows: 1

tests:
  - name: search
    fixture: fixtures/torrentleech/search.html
    expect: { min_rows: 3, required: [title, details, size, seeders] }
  - name: detail
    fixture: fixtures/torrentleech/detail.html
    expect: { min_rows: 0 }
  - name: login-ok
    fixture: fixtures/torrentleech/login-ok.html
    expect: { authenticated: true }
  - name: login-failed
    fixture: fixtures/torrentleech/login-failed.html
    expect: { authenticated: false }
