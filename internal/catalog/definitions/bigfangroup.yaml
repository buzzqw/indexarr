# VERIFICATA (verified). BigFANGroup public browse search.
#
# Written from the public browse page captured on 2026-10-27 in
# fixtures/bigfangroup/search.html
# (https://bigfangroup.org/browse.php?search=matrix), served as windows-1251.
# The tracker answers searches and serves download.php?id=<id> to guests: the
# .torrent is built from the id of the details link, with no detail page. The
# date is a Russian sentence in an image title ("20 февраля 2022 в 12:10:35")
# and is not read.
schema: 1

meta:
  id: bigfangroup
  name: BigFANGroup
  language: ru-RU
  type: public
  protocol: torrent
  author: indexarr
  description: Public Russian movie tracker; guests can search and download the .torrent.
  urls:
