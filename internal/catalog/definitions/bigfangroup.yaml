capabilities:
  search: [q]
  tv-search: [q]
  movie-search: [q]

search:
  request:
    get: /browse.php
    params:
      search: "{{ query.keywords }}"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: 'tr:has(a[href^="details.php?id="])' }
    fields:
      title:    { selector: 'td.indented a[href^="details.php?id="]', filters: [trim] }
      details:  { selector: 'td.indented a[href^="details.php?id="]', attr: href, type: url }
      download:
        selector: 'td.indented a[href^="details.php?id="]'
        attr: href
        filters: [{ regex: 'id=([0-9]+)$' }, { prefix: "/download.php?id=" }]
        type: url
      category: { selector: 'a[href^="browse.php?cat="]', attr: href, filters: [{ query_param: cat }], type: category }
      size:     { selector: "td:nth-of-type(6)", type: size }
      seeders:  { selector: 'a[href*="toseeders=1"]', type: int }
      leechers: { selector: 'a[href*="todlers=1"]', type: int }
    required: [title, details, download, size]

health:
  query: matrix
  min_rows: 3

tests:
  - name: search
    fixture: fixtures/bigfangroup/search.html
    expect: { min_rows: 10, required: [title, details, download, size] }
