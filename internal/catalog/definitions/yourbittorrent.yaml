# VERIFICATA (verified). YourBittorrent public Torznab API.
#
# Written from the public response captured on 2026-11-06 in
# fixtures/yourbittorrent/search.xml
# (https://yourbittorrent.com/torznab/api?t=search&q=test&limit=50). The site
# publishes a free Torznab/Newznab feed for Sonarr, Radarr and Prowlarr with no
# account and no API key; the JSON API documented at /api.html is an
# alternative, not needed here. The torznab family connector reads the endpoint
# from the "url" setting, so the definition only records the official URL, the
# categories advertised by /torznab/api?t=caps and the modes the feed supports.
#
# The separate /api/latest.json feed is deliberately not used: brand-new rows
# carry size and seeders 0 until the backend has processed them, while the
# search feed already returns complete rows.
schema: 1
connector: torznab

meta:
  id: yourbittorrent
  name: YourBittorrent
  language: en-US
  type: public
  protocol: torrent
  author: indexarr
  description: Public YourBittorrent search through its official Torznab API (no account or API key).
  urls:
    - https://yourbittorrent.com/
  updated: "2026-11-06"
  interval: 1h

settings:
  - name: url
    type: text
    label: "Torznab endpoint"
    help: "Official YourBittorrent Torznab API. The API key is optional and may stay empty."
    default: "https://yourbittorrent.com/torznab/api"
    required: true

categories:
  - { site: "2000", standard: 2000, desc: "Movies" }
  - { site: "5000", standard: 5000, desc: "TV" }
  - { site: "5070", standard: 5070, desc: "Anime" }
  - { site: "3000", standard: 3000, desc: "Audio" }
  - { site: "3030", standard: 3030, desc: "Audiobook" }
  - { site: "4000", standard: 4000, desc: "PC" }
  - { site: "4050", standard: 4050, desc: "Games" }
  - { site: "6000", standard: 6000, desc: "XXX" }
  - { site: "7000", standard: 7000, desc: "Books" }
  - { site: "7020", standard: 7020, desc: "Ebook" }
  - { site: "8000", standard: 8000, desc: "Other" }

capabilities:
  search: [q]
  tv-search: [q, season, ep]
  movie-search: [q]
  music-search: [q]
  book-search: [q]

health:
  query: test
  min_rows: 5

tests:
  - name: search
    fixture: fixtures/yourbittorrent/search.xml
    expect: { min_rows: 10, required: [title, magnet, size, seeders, category] }
