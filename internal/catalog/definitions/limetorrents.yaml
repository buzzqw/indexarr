# VERIFICATA (verified). LimeTorrents HTML search.
#
# Written from the public search page captured on 2026-10-23 in
# fixtures/limetorrents/listing.html and from one release page in
# fixtures/limetorrents/detail.html. The listing carries no magnet: it links
# the release page and an external .torrent mirror. The release page has the
# magnet, so the download section resolves it during the search. The category is a word inside
# the "Last Month - in Other" cell; there is no numeric category id in the row.
schema: 1

meta:
  id: limetorrents
  name: LimeTorrents
  language: en-US
  type: public
  protocol: torrent
  author: indexarr
  description: Public LimeTorrents HTML search with magnets on the release page.
  # limetorrents.zone was dropped on 2026-10-29: the domain now serves an
  # unrelated gambling site, and a mirror switch would have landed there.
  # No other LimeTorrents domain answered from this network that day.
  urls:
    - https://www.limetorrents.fun/
  updated: "2026-10-29"
  latest: false

categories:
  - { site: "Movies", standard: 2000, desc: "Movies" }
  - { site: "TV", standard: 5000, desc: "TV" }
  - { site: "Music", standard: 3000, desc: "Audio" }
  - { site: "Games", standard: 4000, desc: "Games" }
  - { site: "Apps", standard: 4000, desc: "Applications" }
  - { site: "Books", standard: 7000, desc: "Books" }
  - { site: "Anime", standard: 5070, desc: "Anime" }
  - { site: "Documentaries", standard: 5080, desc: "Documentaries" }
  - { site: "XXX", standard: 6000, desc: "Adult" }
  - { site: "Other", standard: 8000, desc: "Other" }

capabilities:
  search: [q]
  tv-search: [q]
  movie-search: [q]

search:
  request:
    get: "/search/all/{{ query.keywords }}/"
  pagination: { type: none }
  response:
    type: html
    rows: { selector: "table.table2 tr" }
    fields:
      # The visible anchor is truncated ("..") for long names; the details URL
      # slug carries the complete name and is stable in the fixture too.
      title:
        selector: 'div.tt-name a[href*="-torrent-"]'
        attr: href
        filters:
          - { regex: '/([^/]+)-torrent-[0-9]+\.html' }
          - { replace: "-: " }
      details:  { selector: 'div.tt-name a[href*="-torrent-"]', attr: href, type: url }
      category: { selector: "td:nth-of-type(2)", filters: [{ regex: " in ([A-Za-z]+)" }], type: category }
      size:     { selector: "td:nth-of-type(3)", type: size }
      seeders:  { selector: "td:nth-of-type(4)", type: int }
      leechers: { selector: "td:nth-of-type(5)", type: int }
    required: [title, details]

download:
  resolve_on: search
  from: details
  max_concurrent: 2
  # The listing truncates long titles with ".."; the details page has the
  # complete title in its h1.
  title: { selector: "h1", filters: [trim] }
  extract:
    - magnet:  { selector: 'a[href^="magnet:"]', attr: href }
    - torrent: { selector: 'a[href*=".torrent"]', attr: href, type: url }

# Real browse pages sorted by date. The page number is part of the path; TV
# and Movies are the categories the linked apps ask for.
latest:
  categories:
    - { standard: 5000, site: "TV-shows" }
    - { standard: 2000, site: Movies }
  request:
    get: "/browse-torrents/{{ category }}/date/{{ page }}/"
  pagination: { type: page, start: 1, step: 1, max_pages: 2 }

health:
  query: test
  min_rows: 3

tests:
  - name: search
    fixture: fixtures/limetorrents/listing.html
    expect: { min_rows: 5, required: [title, details, size, seeders] }
  - name: detail
    fixture: fixtures/limetorrents/detail.html
    expect: { min_rows: 0 }
