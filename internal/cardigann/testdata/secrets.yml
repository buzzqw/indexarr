# Synthetic fixture written for indexarr tests. Not derived from a real tracker.
id: synthetic-secrets
name: Synthetic Secret Handling
description: A made-up definition with literal credentials that must not be copied.
type: private
links:
  - https://secrets.example/
settings:
  - { name: username, type: text, label: Username }
  - { name: apikey, type: password, label: API Key, default: "synthetic-default-token" }
login:
  path: login.php
  method: post
  inputs:
    username: "{{ .Config.username }}"
    password: synthetic-literal-password
  test:
    selector: a.logout
  cookies:
    session: synthetic-cookie-value
search:
  paths:
    - path: search.php
  inputs:
    q: "{{ .Keywords }}"
  rows: { selector: table.results tr }
  fields:
    title: { selector: a.title }
    download: { selector: a.dl, attribute: href }
