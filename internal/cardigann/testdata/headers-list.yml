# Synthetic fixture written for indexarr tests. Not derived from a real tracker.
id: synthetic-headers
name: Synthetic Headers API
description: A made-up JSON API with list-valued headers and nested response.
type: private
links:
  - https://headers.example/
settings:
  - { name: apikey, type: text, label: API Key }
caps:
  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
search:
  paths:
    - path: api/search
      response:
        type: json
        rows: { selector: data }
        fields:
          title: { selector: name }
          download: { selector: link }
          size: { selector: size }
  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]
    X-Synthetic-Flags: ["one", "two"]
  inputs:
    q: "{{ .Keywords }}"
    imdb: "{{ .Query.IMDBIDShort }}"
    season: "{{ .Query.Season }}"
