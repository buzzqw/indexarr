name: QA

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate definitions
        run: make def-validate

      - name: Run QA
        run: make qa

  # Unit/integration tests on the three desktop operating systems. CGO stays
  # at Go's default here: the shipped binaries and the SQLite driver are pure
  # Go, so the test results must not depend on a C toolchain.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  # The race detector needs cgo (it links against the C runtime), so this is
  # the only job that forces CGO_ENABLED=1. It runs on the default toolchain
  # with the runner's gcc; the remaining jobs keep cgo disabled/unset.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  # One job per target so a broken target does not hide the others.
  # scripts/build-matrix.sh builds ./cmd/indexarr and ./cmd/indexarr-def and
  # attempts ./cmd/simmock, skipping it where the tool is unsupported. Every
  # indexarr/indexarr-def build failure is fatal.
  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm/7
          - linux/arm/6
          - linux/386
          - linux/riscv64
          - windows/amd64
          - windows/arm64
          - darwin/amd64
          - darwin/arm64
          - freebsd/amd64
          - freebsd/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile ${{ matrix.target }}
        run: ./scripts/build-matrix.sh --target "${{ matrix.target }}"

  # Resource budget. The 80 MiB RSS ceiling is a deliberate temporary override:
  # the current service needs ~64 MiB under load and 32-37 MiB idle, and WP3 is
  # still open. The script's own default remains the manifesto target of 40 MiB.
  # TODO(WP3/WP12): remove this env override once WP3 is closed.
  budget:
    name: Resource budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INDEXARR_BUDGET_RSS_MIB: "80"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check binary size and idle RSS
        run: ./scripts/budget.sh
